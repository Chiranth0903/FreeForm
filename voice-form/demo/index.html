<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FreeForm AI • Test form</title>
<style>body{font:16px/1.6 system-ui;background:#edf1f9;color:#1c2942;margin:0;padding:40px}main{max-width:640px;margin:auto;background:white;padding:36px;border-radius:24px}h1{line-height:1.2}label{display:block;margin-top:18px}input,select,textarea{box-sizing:border-box;font:inherit;width:100%;padding:12px;border:1px solid #bbc6d9;border-radius:8px}input[type=radio],input[type=checkbox]{width:auto}button{background:#6654e8;color:white;border:0;border-radius:10px;padding:14px 24px;margin-top:20px}small{color:#63718a}</style>
<main><small>FREEFORM AI / LOCAL SANDBOX</small><h1>Health insurance enrollment</h1><p>Use fictional details to test your extension. Click its toolbar icon to begin.</p>
<form><label for="first">First name</label><input id="first" required><label for="last">Last name</label><input id="last" required><label for="email">Email</label><input id="email" type="email"><label for="phone">Phone</label><input id="phone" type="tel"><label for="birth">Date of birth</label><input id="birth" type="date"><label for="address">Address</label><textarea id="address"></textarea><label for="city">City</label><input id="city"><label for="plan">Coverage plan</label><select id="plan"><option value="">Choose a plan</option>Individual</option><option>Family</option></select><fieldset><legend>Preferred contact method</legend><label><input type="radio" name="contact" value="email">Email</label><label><input type="radio" name="contact" value="phone">Phone</label></fieldset><label><input id="updates" type="checkbox">Receive updates</label><button>Review demo</button></form><p id="result" role="status"></p></main><script>document.querySelector('form').onsubmit=e=>{e.preventDefault();document.getElementById('result').textContent='Demo complete. Nothing was sent or saved.'}</script></html>
